<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Che Sabor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estiloR.css">
</head>

<body class="bg-black-deep">

    <nav class="navbar navbar-expand-lg navbar-dark nav-glass fixed-top">
        <div class="container">
            <a class="navbar-brand logo-font" href="index.html">CHE <span class="gold-text">SABOR</span></a>
            <button class="navbar-toggler border-gold" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">

            </div>
    </nav>

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="row justify-content-center w-100">
            <div class="col-md-4">
                <div class="login-card p-5 shadow-lg mt-5">
                    <h4 class="gold-text cinzel-font text-center mb-4">INICIAR SESIÓN</h4>

                    <form id="login-form">
                        <div class="mb-4">
                            <label class="label-gold">CORREO</label>
                            <input type="email" id="email" class="input-luxury" placeholder="ejemplo@correo.com"
                                required>
                        </div>
                        <div class="mb-4">
                            <label class="label-gold">CONTRASEÑA</label>
                            <input type="password" id="password" class="input-luxury" placeholder="******" required>
                        </div>
                        <button type="submit" class="btn-luxury w-100 mb-3">ENTRAR</button>
                    </form>

                    <div class="text-center">
                        <a href="registro.html" class="small gold-text text-decoration-none d-block mb-3">¿No tienes
                            cuenta? Regístrate</a>
                        <hr style="border-color: rgba(212,175,55,0.3);">
                        <a href="index.html" class="btn btn-outline-secondary btn-sm text-white w-100"
                            style="border-color: #555;">
                            VOLVER AL INICIO
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqDlvLCSIbHulEUvHdZWzz1RduxtRjfaI",
            authDomain: "app-agenda-5dcd2.firebaseapp.com",
            projectId: "app-agenda-5dcd2",
            storageBucket: "app-agenda-5dcd2.firebasestorage.app",
            messagingSenderId: "1000337212936",
            appId: "1:1000337212936:web:0d0fd7b3159df3de8ab3bd",
            measurementId: "G-BY8D24MD80"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "reservaciones.html";
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    alert("Correo o contraseña incorrectos.");
                } else {
                    alert("Error: " + error.message);
                }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
